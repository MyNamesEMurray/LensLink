<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --w: {{W}}px; --h: {{H}}px; --pad: {{PAD}}px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: var(--w); height: var(--h); overflow: hidden; }
  body {
    background: radial-gradient(90% 55% at 50% 0%, #1c1c1e 0%, #000 70%);
    color: #f5f5f7;
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
    padding: var(--pad) var(--pad) 0;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: {{H1}}px; line-height: 1.06; letter-spacing: -0.025em; font-weight: 700;
    max-width: 11em; text-wrap: balance;
  }
  p {
    margin: calc(var(--pad) * 0.35) 0 0;
    font-size: {{P}}px; line-height: 1.3; color: #a1a1a6; font-weight: 500;
    max-width: 26em; text-wrap: balance;
  }
  .device {
    margin-top: calc(var(--pad) * 0.9);
    width: {{DEVW}}px;
    border-radius: {{RADIUS}}px {{RADIUS}}px 0 0;
    padding: {{BEZEL}}px {{BEZEL}}px 0;
    background: #0b0b0c;
    box-shadow: 0 0 0 2px #2a2a2c, 0 40px 120px rgba(0,0,0,.7);
    flex: none;
  }
  .device img {
    display: block; width: 100%;
    border-radius: calc({{RADIUS}}px - {{BEZEL}}px) calc({{RADIUS}}px - {{BEZEL}}px) 0 0;
  }
</style>
</head>
<body>
  <h1>{{HEADLINE}}</h1>
  <p>{{SUB}}</p>
  <div class="device"><img id="shot" src="{{IMG}}" alt="" data-full-battery="{{FULLBATTERY}}"></div>
  <script>
    // Screenshots taken on a low phone paint the battery pill red. When
    // the shot has a status bar, repaint that pill as a full white
    // battery: cover it with the colour just left of it, then draw the
    // iOS glyph at the same place. Positions are fractions of the frame,
    // so any iPhone-with-Dynamic-Island capture size works.
    const img = document.getElementById('shot');
    if (img.dataset.fullBattery === 'true') {
      const fix = () => {
        const w = img.naturalWidth, h = img.naturalHeight;
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const g = c.getContext('2d');
        g.drawImage(img, 0, 0);
        const B = {{BATTERY}};
        const px = g.getImageData(Math.round(w * B.sampleX), Math.round(h * B.y), 1, 1).data;
        g.fillStyle = `rgb(${px[0]},${px[1]},${px[2]})`;
        g.fillRect(w * B.coverX, h * B.coverY, w * B.coverW, h * B.coverH);
        const bw = w * B.bw, bh = h * B.bh, bx = w * B.bx, by = h * B.y - bh / 2;
        const r = bh * 0.28, nub = bw * 0.06;
        g.fillStyle = '#fff';
        g.beginPath(); g.roundRect(bx, by, bw, bh, r); g.fill();
        g.beginPath(); g.roundRect(bx + bw + nub * 0.7, by + bh * 0.3, nub, bh * 0.4, nub / 2); g.fill();
        img.src = c.toDataURL('image/png');
        img.dataset.fullBattery = 'done';
      };
      if (img.complete) fix(); else img.addEventListener('load', fix, { once: true });
    }
  </script>
</body>
</html>
