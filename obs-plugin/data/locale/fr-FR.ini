StatusBar.Standby="prêt (caméra inactive)"
StatusBar.NotArmed="non armé (caméra inactive)"
Settings.MenuItem="Paramètres LensLink"
Settings.Title="Paramètres LensLink"
Settings.GpuPipeline="Pipeline de décodage GPU (bêta)"
Settings.GpuPipeline.Note="Garde la vidéo décodée sur la carte graphique au lieu de la faire passer par la mémoire système : moins de CPU et de latence, avec les plus gros gains aux hautes résolutions. S’applique à toutes les sources LensLink après un redémarrage d’OBS. Si votre système ne peut pas partager les textures (configurations de GPU ou de pilote inhabituelles), les sources reviennent automatiquement au pipeline standard."
Settings.Web="Panneau de contrôle web (commandes de la caméra + démarrage/arrêt, sur le port ci-dessous)"
Settings.WebPort="Port du panneau"
Settings.Diagnostics="Diagnostic détaillé dans le journal OBS"
Settings.Dump="Écrire la vidéo reçue sur le disque (dépannage)"
Settings.Benchmark="Enregistrer un benchmark du pipeline (une ligne de journal toutes les 5 s + échantillons CSV)"
Settings.CopyDiagnostics="Copier un rapport de diagnostic"
Settings.CopyDiagnostics.Done="Copié. Collez-le dans un ticket GitHub : il contient les versions, le matériel et l’état de connexion, sans vidéo ni données personnelles. Il figure aussi dans le journal OBS."
Settings.Benchmark.Tip="Écrit un résumé [lenslink][bench] dans le journal OBS et un échantillon par seconde dans un fichier CSV du dossier de configuration du plugin (chemin indiqué dans le journal). Diffusez environ 10 s sur chaque pipeline, puis lancez tools/bench-report.py pour obtenir un rapport statistique avant/après avec graphiques."
Status="État"
Status.Connected="Connecté :"
Status.UnknownDevice="Appareil iOS"
Status.Disconnected="Déconnecté – reconnexion"
Status.Paused="En pause – la source est masquée (se reconnecte quand elle est affichée)"
Status.StreamPaused=" · en pause sur le téléphone"
Status.WaitingUSB="Aucun appareil détecté en USB – vérifiez le câble (un câble de données, pas de charge seule) et touchez Se fier sur le téléphone"
Status.WaitingUSB.Windows="Aucun appareil détecté en USB – vérifiez le câble (un câble de données, pas de charge seule), touchez Se fier sur le téléphone, et vérifiez qu’iTunes est installé : il fournit le service Apple Mobile Device auquel le plugin se connecte"
Status.WaitingUSB.Linux="Aucun appareil détecté en USB – vérifiez le câble (un câble de données, pas de charge seule), touchez Se fier sur le téléphone, et vérifiez que le démon usbmuxd est installé et en cours d’exécution (le plugin se connecte à /var/run/usbmuxd)"
Status.USBFound="Appareil détecté, mais l’app LensLink est injoignable – déverrouillez le téléphone et ouvrez l’app (elle doit être à l’écran), puis démarrez la caméra depuis l’app ou d’ici, ou lancez une diffusion de l’écran"
Status.Dialing="Tentative de connexion au téléphone à l’adresse"
Status.NoHost="Saisissez l’adresse IP du téléphone (affichée dans l’app LensLink)"
Status.DeviceBusy="Cet appareil est déjà utilisé par une autre source LensLink – un téléphone ne peut alimenter qu’une source à la fois"
Status.DecoderFailed="Connecté, mais cette version d’OBS ne peut pas décoder le flux – essayez H.264 dans l’app"
Status.CameraOnScreen="Le téléphone envoie sa caméra – ceci est une source LensLink Screen. Lancez une diffusion de l’écran sur le téléphone, ou utilisez une source LensLink Camera."
Status.ScreenOnCamera="Le téléphone envoie une diffusion de l’écran – ceci est une source LensLink Camera. Utilisez une source LensLink Screen pour la recevoir."
Status.WaitingPinned="En attente de la connexion de l’appareil USB sélectionné"
Status.GreenScreen=" · écran vert activé"
Status.GreenScreen.NoFilter=" · écran vert activé, mais rien ne retire le vert – cette source n’a pas de filtre d’incrustation par chrominance"
Status.Standby="Connecté – la caméra est inactive. Elle peut être démarrée d’ici (voir « Démarrer la caméra sur le téléphone »)."
Status.NotArmed="Connecté – la caméra est inactive, mais le démarrage à distance n’est pas armé sur le téléphone. Touchez « Armer le démarrage à distance » dans l’app LensLink, ou démarrez la caméra depuis l’app."
Status.StartingCamera="Démarrage de la caméra du téléphone…"
HelpText="Ouvrez l’app LensLink sur votre iPhone/iPad et touchez Démarrer la caméra – ou touchez « Armer le démarrage à distance » et OBS démarre la caméra lui-même. Ensuite, saisissez ci-dessus l’adresse IP du téléphone (affichée dans l’app) avec Connexion réglée sur Wi-Fi, ou branchez le téléphone avec un câble USB et réglez Connexion sur Câble USB (ce qui nécessite iTunes sous Windows, ou le démon usbmuxd sous Linux)."
HelpTextScreen="Dans l’app LensLink sur votre iPhone/iPad, touchez « Recopier l’écran », choisissez LensLink Screen, puis Commencer la diffusion. Connectez-vous en Wi-Fi (saisissez l’IP du téléphone ci-dessus) ou avec un câble USB (ce qui nécessite iTunes sous Windows, ou le démon usbmuxd sous Linux). L’audio système du téléphone est inclus ; les apps protégées par DRM (Apple Music, Netflix) se coupent pendant les diffusions."

