Description="LensLink – utilisez la caméra d’un iPhone ou d’un iPad, ou recopiez son écran, comme source vidéo en Wi-Fi ou en USB (app compagnon LensLink requise)"
IOSCameraSource="LensLink Camera"
ScreenSource="LensLink Screen"
Mode="Connexion"
Mode.Dial="Wi-Fi – saisissez l’IP du téléphone"
Mode.USB="Câble USB"
Host="Téléphone – choisissez-en un trouvé sur le réseau, ou saisissez son IP (affichée dans l’app)"
UsbDevice="Appareil USB"
UsbDevice.Auto="Auto (premier disponible)"
UsbDevice.Device="iPhone/iPad"
UsbDevice.NotConnected="non connecté"
LowLatency="Mode faible latence (afficher immédiatement l’image la plus récente)"
HwDecode="Décodage matériel (GPU) – repli automatique sur le décodage logiciel"
DeactivateHidden="Se déconnecter quand cette source n’est affichée nulle part"
DeactivateHidden.Desc="Quand la source est masquée (icône en forme d’œil désactivée, ou dans aucune scène, aucun aperçu ni aucun projecteur visible), elle se déconnecte du téléphone pour qu’il cesse d’encoder : cela économise la batterie du téléphone et le libère pour une autre source LensLink. Elle se reconnecte automatiquement quand elle est de nouveau affichée. Avec le démarrage auto activé, elle arrête aussi la caméra du téléphone quand elle est masquée et la redémarre quand elle est affichée."
ScreenFps="Fréquence d’images"
ScreenFps.60="60 fps"
ScreenFps.30="30 fps (moins de Wi-Fi et de batterie)"
ScreenFps.Desc="Nombre d’images par seconde envoyées par le téléphone. À 30 fps, le téléphone encode environ deux fois moins et utilise environ deux fois moins de bande passante Wi-Fi : suffisant pour des diapositives, des documents et des apps, moins fluide pour les jeux et la vidéo. Le téléphone capture toujours à sa fréquence maximale et saute des images avant l’encodage. Les versions plus anciennes de l’app ignorent ce réglage et continuent d’envoyer 60 fps."
AutoStart="Démarrer automatiquement la caméra du téléphone quand il est prêt"
AutoStart.Desc="Une fois le démarrage à distance armé dans l’app LensLink (son bouton « Armer le démarrage à distance »), cette source démarre la caméra d’elle-même, sans qu’il faille retoucher au téléphone. Désactivez cette option pour démarrer vous-même : avec le bouton ci-dessous ou depuis le panneau web tant que l’app est armée, ou sur le téléphone."
StartCamera="Démarrer la caméra sur le téléphone"
PauseCamera="Mettre en pause le flux (le téléphone reste connecté)"
ResumeCamera="Reprendre le flux"
StopCamera="Arrêter la caméra sur le téléphone"
AudioSource="Source audio de synchro labiale"
AudioSource.None="(aucune)"
AudioSync="Retarder automatiquement cette source audio pour l’aligner sur la latence de la caméra"
AutoCalibrate="Calibration auto depuis le micro du téléphone (activez « Référence de synchro labiale auto » dans l’app ; ignore la latence manuelle ci-dessous)"
AutoVideoDelay="Retard vidéo auto pour micros lents (retarde la vidéo pour l’aligner sur un micro plus lent que le flux)"
AudioLatency="Latence propre du périphérique audio (soustraite du retard ; mode manuel uniquement)"
HealthDock="LensLink"
HealthDock.Empty="Aucune source LensLink. Ajoutez-en une via Sources → + → LensLink Camera."
