Settings.MenuItem="Configurações do LensLink"
Settings.Title="Configurações do LensLink"
Settings.GpuPipeline="Pipeline de decodificação na GPU (beta)"
Settings.GpuPipeline.Note="Mantém o vídeo decodificado na placa de vídeo em vez de passá-lo pela memória do sistema: menos uso de CPU e menos latência, com os maiores ganhos em resoluções altas. Vale para todas as fontes LensLink depois de reiniciar o OBS. Se o seu sistema não consegue compartilhar texturas (configurações incomuns de GPU ou driver), as fontes voltam ao pipeline padrão automaticamente."
Settings.Web="Painel de controle no navegador (controles da câmera + iniciar/parar, na porta abaixo)"
Settings.WebPort="Porta do painel"
Settings.Diagnostics="Diagnóstico detalhado no log do OBS"
Settings.Dump="Gravar vídeo recebido em disco (solução de problemas)"
Settings.Benchmark="Registrar benchmark do pipeline (linha no log a cada 5 s + amostras em CSV)"
Settings.CopyDiagnostics="Copiar um relatório de diagnóstico"
Settings.CopyDiagnostics.Done="Copiado. Cole em uma issue no GitHub: ele traz versões, hardware e estado da conexão, sem vídeo nem dados pessoais. Ele também está no log do OBS."
Settings.Benchmark.Tip="Registra um resumo [lenslink][bench] no log do OBS e grava uma amostra por segundo em um CSV na pasta de configuração do plugin (o caminho aparece no log). Transmita ~10 s em cada pipeline e depois rode tools/bench-report.py para obter um relatório estatístico de antes e depois, com gráficos."
