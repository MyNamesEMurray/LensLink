DeactivateHidden="Desconectar quando esta fonte não aparecer em lugar nenhum"
DeactivateHidden.Desc="Quando a fonte está oculta (ícone do olho desativado, ou fora de qualquer cena, pré-visualização ou projetor visível), desconecta do celular para que ele pare de codificar: economiza a bateria do celular e o deixa livre para outra fonte LensLink. Reconecta automaticamente quando a fonte volta a aparecer. Com o início automático ativado, também para a câmera do celular ao ocultar e a inicia de novo ao mostrar."
ScreenFps="Taxa de quadros"
ScreenFps.60="60 fps"
ScreenFps.30="30 fps (menos Wi-Fi e bateria)"
ScreenFps.Desc="Quantos quadros por segundo o celular envia. Com 30 fps o celular codifica cerca de metade e usa cerca de metade da banda do Wi-Fi: bom para slides, documentos e apps, menos fluido para jogos e vídeos. O celular continua capturando na taxa máxima e descarta quadros antes de codificar. Versões mais antigas do app ignoram este ajuste e continuam enviando 60 fps."
AutoStart="Iniciar a câmera do celular automaticamente quando estiver pronta"
AutoStart.Desc="Quando o app LensLink está aberto e ocioso (com a opção “Início remoto pelo OBS” ativada), esta fonte inicia a câmera sozinha, sem precisar tocar no celular. Desative para iniciar manualmente com o botão abaixo, pelo painel web ou no celular."
StartCamera="Iniciar câmera no celular"
PauseCamera="Pausar a transmissão (o celular continua conectado)"
ResumeCamera="Retomar a transmissão"
StopCamera="Parar câmera no celular"
AudioSource="Fonte de áudio para sincronia labial"
AudioSource.None="(nenhuma)"
AudioSync="Atrasar automaticamente essa fonte de áudio para acompanhar a latência da câmera"
AutoCalibrate="Calibrar automaticamente pelo microfone do celular (ative “Referência automática de sincronia labial” no app; ignora a latência manual abaixo)"
AutoVideoDelay="Atraso automático de vídeo para microfones lentos (atrasa o vídeo para acompanhar um microfone mais lento que a transmissão)"
AudioLatency="Latência própria do dispositivo de áudio (subtraída do atraso; só no modo manual)"
