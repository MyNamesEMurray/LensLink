Status.WaitingUSB="Nenhum dispositivo detectado via USB: verifique o cabo (um de dados, não só de carga) e toque em Confiar no celular"
Status.WaitingUSB.Windows="Nenhum dispositivo detectado via USB: verifique o cabo (um de dados, não só de carga), toque em Confiar no celular e confira se o iTunes está instalado, já que ele fornece o Apple Mobile Device Service ao qual o plugin se conecta"
Status.WaitingUSB.Linux="Nenhum dispositivo detectado via USB: verifique o cabo (um de dados, não só de carga), toque em Confiar no celular e confira se o daemon usbmuxd está instalado e rodando (o plugin se conecta a /var/run/usbmuxd)"
Status.USBFound="Dispositivo encontrado, mas o app LensLink não está acessível: desbloqueie o celular e abra o app (ele precisa estar na tela), depois inicie a câmera lá ou por aqui, ou inicie uma transmissão de tela"
Status.Dialing="Tentando se conectar ao celular em"
Status.NoHost="Digite o endereço IP do celular (mostrado no app LensLink)"
Status.DeviceBusy="Este dispositivo já está em uso por outra fonte LensLink: um celular só alimenta uma fonte por vez"
Status.DecoderFailed="Conectado, mas esta versão do OBS não consegue decodificar o vídeo: tente H.264 no app"
Status.CameraOnScreen="O celular está enviando a câmera, e esta é uma fonte LensLink Screen. Inicie uma transmissão de tela no celular ou use uma fonte LensLink Camera."
Status.ScreenOnCamera="O celular está enviando uma transmissão de tela, e esta é uma fonte LensLink Camera. Use uma fonte LensLink Screen para ela."
Status.WaitingPinned="Aguardando o dispositivo USB selecionado ser conectado"
Status.GreenScreen=" · tela verde ativada"
Status.GreenScreen.NoFilter=" · tela verde ativada, mas nada está removendo o verde: esta fonte não tem filtro chroma key"
Status.Standby="Conectado: a câmera está inativa. Ela pode ser iniciada por aqui (veja “Iniciar câmera no celular”)."
Status.StartingCamera="Iniciando a câmera do celular…"
HelpText="Abra o app LensLink no seu iPhone/iPad. Com a opção “Início remoto pelo OBS” do app ativada (o padrão), basta deixá-lo aberto; caso contrário, toque em Iniciar. Depois, digite acima o endereço IP do celular (mostrado no app) com Conexão definida como Wi-Fi, ou conecte o celular com um cabo USB e defina Conexão como Cabo USB (o que exige o iTunes no Windows ou o daemon usbmuxd no Linux)."
HelpTextScreen="No app LensLink do seu iPhone/iPad, toque em “Espelhar tela”, escolha LensLink Screen e toque em Iniciar Transmissão. Conecte via Wi-Fi (digite o IP do celular acima) ou cabo USB (o que exige o iTunes no Windows ou o daemon usbmuxd no Linux). O áudio do sistema do celular vem junto; apps com DRM (Apple Music, Netflix) ficam mudos durante transmissões."

