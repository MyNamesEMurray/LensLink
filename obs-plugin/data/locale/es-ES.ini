DeactivateHidden="Desconectar cuando esta fuente no se muestre en ninguna parte"
DeactivateHidden.Desc="Cuando la fuente está oculta (con el ojo desactivado, o fuera de toda escena, vista previa o proyector visible), se desconecta del teléfono para que deje de codificar: ahorra batería del teléfono y lo deja libre para otra fuente de LensLink. Se vuelve a conectar automáticamente al mostrarse. Con el inicio automático activado, también detiene la cámara del teléfono al ocultarse y la vuelve a iniciar al mostrarse."
AutoStart="Iniciar automáticamente la cámara del teléfono cuando esté lista"
AutoStart.Desc="Cuando la app LensLink está abierta e inactiva (con su opción “Inicio remoto desde OBS” activada), esta fuente inicia la cámara por sí sola, sin tocar el teléfono. Desactívalo para iniciarla a mano con el botón de abajo, desde el panel web o en el teléfono."
