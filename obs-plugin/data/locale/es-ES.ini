Settings.MenuItem="Ajustes de LensLink"
Settings.Title="Ajustes de LensLink"
Settings.GpuPipeline="Pipeline de decodificación en GPU (beta)"
Settings.GpuPipeline.Note="Mantiene el video decodificado en la tarjeta gráfica en lugar de pasarlo por la memoria del sistema: menos uso de CPU y menos latencia, con las mayores mejoras a resoluciones altas. Se aplica a todas las fuentes de LensLink tras reiniciar OBS. Si tu sistema no puede compartir texturas (configuraciones poco habituales de GPU o controlador), las fuentes vuelven automáticamente al pipeline estándar."
Settings.Web="Panel de control en el navegador (controles de cámara e inicio/detención, en el puerto de abajo)"
Settings.WebPort="Puerto del panel"
Settings.Diagnostics="Diagnóstico detallado en el registro de OBS"
Settings.Dump="Volcar el video recibido al disco (solución de problemas)"
Settings.Benchmark="Registrar métricas de rendimiento del pipeline (una línea en el registro cada 5 s y muestras en CSV)"
Settings.CopyDiagnostics="Copiar un informe de diagnóstico"
Settings.CopyDiagnostics.Done="Copiado. Pégalo en una incidencia de GitHub: incluye versiones, hardware y estado de conexión, sin video ni datos personales. También está en el registro de OBS."
Settings.Benchmark.Tip="Escribe un resumen [lenslink][bench] en el registro de OBS y una muestra por segundo en un CSV de la carpeta de configuración del plugin (la ruta aparece en el registro). Transmite unos 10 s con cada pipeline y después ejecuta tools/bench-report.py para obtener un informe estadístico de antes y después, con gráficos."
