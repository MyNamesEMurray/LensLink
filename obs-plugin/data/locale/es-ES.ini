AudioSync="Retrasar automáticamente esa fuente de audio para igualar la latencia de la cámara"
AutoCalibrate="Calibración automática con el micrófono del teléfono (activa “Referencia de sincronía labial automática” en la app; ignora la latencia manual de abajo)"
AutoVideoDelay="Retraso de video automático para micrófonos lentos (retrasa el video para igualar un micrófono más lento que la transmisión)"
AudioLatency="Latencia propia del dispositivo de audio (se resta del retraso; solo en modo manual)"
