Status.StreamPaused=" · en pausa en el teléfono"
Status.WaitingUSB="No se detecta ningún dispositivo por USB: revisa el cable (debe ser de datos, no solo de carga) y toca Confiar en el teléfono"
Status.WaitingUSB.Windows="No se detecta ningún dispositivo por USB: revisa el cable (debe ser de datos, no solo de carga), toca Confiar en el teléfono y comprueba que iTunes está instalado, porque proporciona el Apple Mobile Device Service al que se conecta el plugin"
Status.WaitingUSB.Linux="No se detecta ningún dispositivo por USB: revisa el cable (debe ser de datos, no solo de carga), toca Confiar en el teléfono y comprueba que el daemon usbmuxd está instalado y en ejecución (el plugin se conecta a /var/run/usbmuxd)"
Status.USBFound="Dispositivo encontrado, pero no se puede acceder a la app LensLink: desbloquea el teléfono y abre la app (debe estar en pantalla); después inicia la cámara allí o desde aquí, o inicia una transmisión de pantalla"
Status.Dialing="Intentando conectar con el teléfono en"
Status.NoHost="Escribe la dirección IP del teléfono (se muestra en la app LensLink)"
Status.DeviceBusy="Otra fuente de LensLink ya está usando este dispositivo: un teléfono solo puede alimentar una fuente a la vez"
Status.DecoderFailed="Conectado, pero esta versión de OBS no puede decodificar la transmisión: prueba H.264 en la app"
Status.CameraOnScreen="El teléfono está enviando su cámara, y esta es una fuente LensLink Screen. Inicia una transmisión de pantalla en el teléfono o usa una fuente LensLink Camera."
Status.ScreenOnCamera="El teléfono está enviando una transmisión de pantalla, y esta es una fuente LensLink Camera. Usa una fuente LensLink Screen para recibirla."
Status.WaitingPinned="Esperando a que se conecte el dispositivo USB seleccionado"
Status.GreenScreen=" · pantalla verde activada"
Status.GreenScreen.NoFilter=" · pantalla verde activada, pero nada elimina el verde: esta fuente no tiene un filtro Fondo croma"
Status.Standby="Conectado: la cámara está inactiva. Se puede iniciar desde aquí (consulta “Iniciar la cámara en el teléfono”)."
Status.StartingCamera="Iniciando la cámara del teléfono…"
HelpText="Abre la app LensLink en tu iPhone/iPad. Con la opción “Inicio remoto desde OBS” de la app activada (la predeterminada), basta con tenerla abierta; si no, toca Iniciar. Después, escribe arriba la dirección IP del teléfono (se muestra en la app) con Conexión en Wi-Fi, o conecta el teléfono con un cable USB y pon Conexión en Cable USB (necesita iTunes en Windows o el daemon usbmuxd en Linux)."
HelpTextScreen="En la app LensLink de tu iPhone/iPad, toca “Duplicar pantalla”, elige LensLink Screen y toca Iniciar transmisión. Conéctate por Wi-Fi (escribe arriba la IP del teléfono) o con un cable USB (necesita iTunes en Windows o el daemon usbmuxd en Linux). El audio del sistema del teléfono también llega; las apps con DRM (Apple Music, Netflix) se silencian durante las transmisiones."

