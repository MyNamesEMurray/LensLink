AudioSource.None="（无）"
AudioSync="自动延迟该音频来源，使其与摄像头延迟一致"
AutoCalibrate="自动校准：依据手机麦克风（需在 App 中开启“自动音画同步参考”；会忽略下方的手动延迟）"
AutoVideoDelay="为慢速麦克风自动延迟视频（麦克风比视频流更慢时，延迟视频与之对齐）"
AudioLatency="音频设备自身延迟（从延迟中扣除；仅限手动模式）"
HealthDock="LensLink"
HealthDock.Empty="没有 LensLink 来源。可通过 源 → + → LensLink Camera 添加。"
