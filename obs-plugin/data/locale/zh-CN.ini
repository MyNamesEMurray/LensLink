Settings.MenuItem="LensLink 设置"
Settings.Title="LensLink 设置"
Settings.GpuPipeline="GPU 解码管线（测试版）"
Settings.GpuPipeline.Note="让解码后的视频留在显卡上，而不经过系统内存：CPU 占用和延迟更低，分辨率越高收益越大。重启 OBS 后作用于所有 LensLink 来源。如果你的系统无法共享纹理（少见的 GPU 或驱动配置），来源会自动回退到标准管线。"
Settings.Web="浏览器控制面板（摄像头控制及启动/停止，使用下方端口）"
Settings.WebPort="面板端口"
Settings.Diagnostics="在 OBS 日志中记录详细诊断"
Settings.Dump="将接收的视频转储到磁盘（用于故障排除）"
Settings.Benchmark="记录管线基准测试（每 5 秒一条日志 + CSV 样本）"
Settings.CopyDiagnostics="复制诊断报告"
Settings.CopyDiagnostics.Done="已复制。把它粘贴到 GitHub issue 中：其中包含版本、硬件和连接状态，不含视频或个人数据。OBS 日志中也有一份。"
Settings.Benchmark.Tip="在 OBS 日志中记录 [lenslink][bench] 摘要，并每秒向插件配置文件夹中的 CSV 写入一个样本（路径见日志）。在每种管线上各推流约 10 秒，然后运行 tools/bench-report.py，即可得到带图表的前后对比统计报告。"
Status="状态"
Status.Connected="已连接："
Status.UnknownDevice="iOS 设备"
Status.Disconnected="已断开，正在重新连接"
Status.Paused="已暂停：来源已隐藏（显示时重新连接）"
Status.StreamPaused=" · 已在手机上暂停"
Status.WaitingUSB="未在 USB 上检测到设备：检查线缆（须为数据线，而非仅充电线），并在手机上轻点“信任”"
Status.WaitingUSB.Windows="未在 USB 上检测到设备：检查线缆（须为数据线，而非仅充电线），在手机上轻点“信任”，并确认已安装 iTunes：插件所连接的 Apple Mobile Device Service 由它提供"
Status.WaitingUSB.Linux="未在 USB 上检测到设备：检查线缆（须为数据线，而非仅充电线），在手机上轻点“信任”，并确认 usbmuxd 守护进程已安装且正在运行（插件连接的是 /var/run/usbmuxd）"
Status.USBFound="已找到设备，但无法连接到 LensLink App：解锁手机并打开 App（必须显示在屏幕上），然后在手机上或从这里启动摄像头，或者开始屏幕直播"
Status.Dialing="正在尝试连接手机"
Status.NoHost="输入手机的 IP 地址（LensLink App 中有显示）"
Status.DeviceBusy="此设备已被另一个 LensLink 来源占用：一部手机同一时间只能为一个来源供流"
Status.DecoderFailed="已连接，但此 OBS 版本无法解码该视频流：在 App 中改用 H.264"
Status.CameraOnScreen="手机正在发送摄像头画面，而这是 LensLink Screen 来源。在手机上开始屏幕直播，或改用 LensLink Camera 来源。"
Status.ScreenOnCamera="手机正在发送屏幕直播，而这是 LensLink Camera 来源。屏幕直播要用 LensLink Screen 来源。"
Status.WaitingPinned="正在等待所选 USB 设备连接"
Status.GreenScreen=" · 绿幕已开启"
Status.GreenScreen.NoFilter=" · 绿幕已开启，但没有滤镜抠除绿色：此来源没有色度键滤镜"
Status.Standby="已连接，摄像头空闲。可以从这里启动（见“启动手机上的摄像头”）。"
Status.StartingCamera="正在启动手机摄像头…"
HelpText="在 iPhone/iPad 上打开 LensLink App：如果 App 的“从 OBS 远程启动”选项已开启（默认），保持 App 打开即可；否则轻点“启动摄像头”。然后，将“连接”设为 Wi-Fi 并在上方输入手机的 IP 地址（App 中有显示），或者用 USB 线连接手机并将“连接”设为 USB（Windows 上需要 iTunes，Linux 上需要 usbmuxd 守护进程）。"
HelpTextScreen="在 iPhone/iPad 上的 LensLink App 中轻点“镜像屏幕”，选择 LensLink Screen，然后轻点“开始直播”。通过 Wi-Fi（在上方输入手机的 IP）或 USB 线连接（Windows 上需要 iTunes，Linux 上需要 usbmuxd 守护进程）。手机的系统音频会一并传输；DRM 应用（Apple Music、Netflix）会在直播期间自行静音。"

