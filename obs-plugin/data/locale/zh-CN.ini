DeactivateHidden.Desc="来源被隐藏时（眼睛图标关闭，或不在任何可见的场景、预览或投影中），断开与手机的连接，让手机停止编码：既省电，又能把手机让给其他 LensLink 来源。重新显示时自动重连。若开启了自动启动，隐藏时还会停止手机摄像头，显示时再次启动。"
AutoStart="手机就绪时自动启动其摄像头"
AutoStart.Desc="当 LensLink App 已打开且空闲（其“从 OBS 远程启动”选项已开启）时，此来源会自行启动摄像头，无需碰手机。关闭后，可用下方按钮、浏览器面板或在手机上手动启动。"
StartCamera="启动手机上的摄像头"
PauseCamera="暂停推流（手机保持连接）"
