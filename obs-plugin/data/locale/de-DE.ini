AutoCalibrate="Automatisch kalibrieren über das Smartphone-Mikro („Automatische Lippensynchron-Referenz“ in der App aktivieren; ignoriert die manuelle Latenz unten)"
AutoVideoDelay="Automatische Videoverzögerung für langsame Mikrofone (verzögert das Video passend zu einem Mikrofon, das langsamer ist als der Stream)"
AudioLatency="Eigene Latenz des Audiogeräts (wird von der Verzögerung abgezogen; nur im manuellen Modus)"
