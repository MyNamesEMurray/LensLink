Settings.Title="LensLink-Einstellungen"
Settings.GpuPipeline="GPU-Dekodier-Pipeline (Beta)"
Settings.GpuPipeline.Note="Hält dekodiertes Video auf der Grafikkarte, statt es durch den Arbeitsspeicher zu leiten – weniger CPU-Last und Latenz, die größten Gewinne bei hohen Auflösungen. Gilt für alle LensLink-Quellen nach einem Neustart von OBS. Kann dein System keine Texturen teilen (ungewöhnliche GPU- oder Treiber-Konfigurationen), fallen die Quellen automatisch auf die Standard-Pipeline zurück."
