Settings.Benchmark="Pipeline-Benchmark aufzeichnen (Log-Zeile alle 5 s + CSV-Messwerte)"
Settings.CopyDiagnostics="Diagnosebericht kopieren"
Settings.CopyDiagnostics.Done="Kopiert. Füge ihn in ein GitHub-Issue ein – er enthält Versionen, Hardware und Verbindungszustand, kein Video und keine persönlichen Daten. Er steht auch im OBS-Log."
Settings.Benchmark.Tip="Schreibt eine [lenslink][bench]-Zusammenfassung ins OBS-Log und pro Sekunde einen Messwert in eine CSV-Datei im Konfigurationsordner des Plugins (der Pfad steht im Log). Streame etwa 10 s mit jeder Pipeline und führe dann tools/bench-report.py aus, um einen statistischen Vorher-nachher-Bericht mit Diagrammen zu erhalten."
