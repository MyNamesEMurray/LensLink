DeactivateHidden="Trennen, wenn diese Quelle nirgends angezeigt wird"
DeactivateHidden.Desc="Ist die Quelle ausgeblendet (Augensymbol aus oder in keiner sichtbaren Szene, Vorschau und keinem Projektor), wird die Verbindung zum Smartphone getrennt, sodass es nicht mehr kodiert – das spart Akku und macht es für eine andere LensLink-Quelle frei. Verbindet sich automatisch wieder, sobald die Quelle wieder angezeigt wird. Mit aktivem Autostart wird beim Ausblenden auch die Kamera des Smartphones gestoppt und beim Einblenden wieder gestartet."
AutoStart="Kamera des Smartphones automatisch starten, sobald es bereit ist"
AutoStart.Desc="Wenn die LensLink-App geöffnet und im Leerlauf ist (mit aktivierter Option „Fernstart durch OBS“), startet diese Quelle die Kamera selbst – ohne dass du das Smartphone anfassen musst. Schalte es aus, um manuell zu starten: mit der Schaltfläche unten, im Browser-Steuerfeld oder am Smartphone."
