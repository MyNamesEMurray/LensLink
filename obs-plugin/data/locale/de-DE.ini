Status.Disconnected="Getrennt – Verbindung wird wiederhergestellt"
Status.Paused="Pausiert – Quelle ist ausgeblendet (verbindet sich wieder, sobald sie angezeigt wird)"
Status.StreamPaused=" · auf dem Smartphone pausiert"
Status.WaitingUSB="Kein Gerät über USB erkannt – prüfe das Kabel (ein Datenkabel, kein reines Ladekabel) und tippe auf dem Smartphone auf „Vertrauen“"
Status.WaitingUSB.Windows="Kein Gerät über USB erkannt – prüfe das Kabel (ein Datenkabel, kein reines Ladekabel), tippe auf dem Smartphone auf „Vertrauen“ und stell sicher, dass iTunes installiert ist: Es liefert den Apple Mobile Device Service, mit dem sich das Plugin verbindet"
Status.WaitingUSB.Linux="Kein Gerät über USB erkannt – prüfe das Kabel (ein Datenkabel, kein reines Ladekabel), tippe auf dem Smartphone auf „Vertrauen“ und stell sicher, dass der Daemon usbmuxd installiert ist und läuft (das Plugin verbindet sich mit /var/run/usbmuxd)"
Status.USBFound="Gerät gefunden, aber die LensLink-App ist nicht erreichbar – entsperre das Smartphone und öffne die App (sie muss auf dem Bildschirm sein), starte dann die Kamera dort oder von hier aus, oder starte eine Bildschirmübertragung"
Status.Dialing="Verbindungsversuch mit dem Smartphone unter"
Status.NoHost="IP-Adresse des Smartphones eingeben (wird in der LensLink-App angezeigt)"
Status.DeviceBusy="Dieses Gerät wird bereits von einer anderen LensLink-Quelle verwendet – ein Smartphone kann immer nur eine Quelle beliefern"
Status.DecoderFailed="Verbunden, aber dieser OBS-Build kann den Stream nicht dekodieren – versuche H.264 in der App"
Status.CameraOnScreen="Smartphone sendet seine Kamera – dies ist eine Quelle LensLink Screen. Starte eine Bildschirmübertragung auf dem Smartphone oder nutze eine Quelle LensLink Camera."
Status.ScreenOnCamera="Smartphone sendet eine Bildschirmübertragung – dies ist eine Quelle LensLink Camera. Nutze dafür eine Quelle LensLink Screen."
Status.WaitingPinned="Warten auf das ausgewählte USB-Gerät (nicht angeschlossen)"
Status.GreenScreen=" · Greenscreen an"
Status.GreenScreen.NoFilter=" · Greenscreen an, aber nichts stanzt ihn aus – diese Quelle hat keinen Chroma-Key-Filter"
Status.Standby="Verbunden – die Kamera ist im Leerlauf. Sie lässt sich von hier aus starten (siehe „Kamera auf dem Smartphone starten“)."
Status.StartingCamera="Kamera des Smartphones wird gestartet …"
HelpText="Öffne die LensLink-App auf deinem iPhone/iPad – ist ihre Option „Fernstart durch OBS“ aktiviert (Standard), reicht es, sie geöffnet zu haben; sonst tippe auf „Starten“. Gib dann oben die IP-Adresse des Smartphones ein (wird in der App angezeigt) und stell „Verbindung“ auf WLAN, oder schließ das Smartphone mit einem USB-Kabel an und stell „Verbindung“ auf USB (braucht iTunes unter Windows oder den Daemon usbmuxd unter Linux)."
HelpTextScreen="Tippe in der LensLink-App auf deinem iPhone/iPad auf „Bildschirm spiegeln“, wähle LensLink Screen und tippe auf „Übertragung starten“. Verbinde über WLAN (gib oben die IP des Smartphones ein) oder USB-Kabel (braucht iTunes unter Windows oder den Daemon usbmuxd unter Linux). Der Systemton des Smartphones kommt mit; DRM-Apps (Apple Music, Netflix) schalten sich während einer Übertragung stumm."

