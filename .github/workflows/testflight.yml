name: TestFlight

# Builds, signs, and uploads the iOS app (with the screen-mirror extension)
# to TestFlight. Signing is fully cloud-managed via an App Store Connect
# API key + `-allowProvisioningUpdates`, so no certificates or provisioning
# profiles are stored in the repo.
#
# One-time setup (see docs/TESTFLIGHT.md): create an App Store Connect API
# key and add these repository secrets:
#   APP_STORE_CONNECT_KEY_ID       - the key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID    - the Issuer ID (Users and Access → Integrations)
#   APP_STORE_CONNECT_KEY_P8       - the full contents of the .p8 file
#   APPLE_TEAM_ID                  - your 10-character Developer Team ID
# and create the app record (bundle id com.exaltedpixels.LensLinkCamera) in
# App Store Connect once.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to take the "What to Test" notes from. Needed when
          that release is a pre-release, which the default lookup skips.
        required: false
        type: string
  # Only fires for releases published by a real user. Auto-releases are
  # published with GITHUB_TOKEN, whose events GitHub suppresses from
  # triggering workflows — auto-release.yml therefore *calls* this
  # workflow directly instead (workflow_call below).
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: >-
          Release tag this build comes from, for the "What to Test" notes.
          Required for pre-releases: the fallback lookup is
          /releases/latest, which by definition skips them.
        required: false
        type: string

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build & upload to TestFlight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Guard on secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "$KEY_ID" ]; then
            echo "::error::App Store Connect secrets are not set — see docs/TESTFLIGHT.md."
            exit 1
          fi

      # App Store Connect rejects uploads built with older SDKs ("must be
      # built with the iOS 26 SDK or later"); the runner's default Xcode
      # is older, so pick the newest Xcode 26.x on the image.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26.x on this runner image. Installed:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios-app

      - name: Write App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8

      # Highest existing build in App Store Connect + 1. Derived from ASC
      # rather than GITHUB_RUN_NUMBER because run numbers are per-workflow
      # counters: a directly-dispatched upload and one called from
      # auto-release count in unrelated sequences, and the first manual
      # dispatch shipped build 1011 into a history already at 1039 —
      # which TestFlight then never offered as an update (auto-update
      # follows the highest number). Falls back to epoch seconds if ASC
      # is unreachable: ugly, but strictly increasing.
      - name: Next build number (App Store Connect)
        id: buildnum
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          BUNDLE_ID: com.exaltedpixels.LensLinkCamera
        run: |
          # Homebrew python3 is PEP 668 "externally managed" — venv it.
          # The "What to Test" step reuses this venv.
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet PyJWT cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" \
            .github/scripts/testflight_next_build.py

      - name: Archive (unsigned)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The release tag, whichever trigger delivered it. Empty on a
          # bare manual dispatch — the project.yml default applies then.
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -o pipefail
          BUILD_NUMBER="${{ steps.buildnum.outputs.build_number }}"
          # TestFlight's "Version" comes from the tag: v1.8.2 -> 1.8.2,
          # and a beta strips to its base version (v1.8.2-beta.3 -> 1.8.2;
          # ASC rejects suffixed version strings) — betas of a version are
          # told apart by build number, which is the TestFlight convention.
          APP_VERSION="${RELEASE_TAG#v}"
          APP_VERSION="${APP_VERSION%%-*}"
          VERSION_OVERRIDE=""
          if [ -n "$APP_VERSION" ]; then
            VERSION_OVERRIDE="MARKETING_VERSION=$APP_VERSION"
          fi
          # Archive WITHOUT signing. Automatic signing here defaults to a
          # *development* profile (get-task-allow=1), which needs a
          # registered device this CI account has none of. The export step
          # does all the signing with a distribution profile instead
          # (distribution profiles need no device).
          xcodebuild archive \
            -project LensLink.xcodeproj \
            -scheme LensLink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LensLink.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            $VERSION_OVERRIDE
        working-directory: ios-app

      - name: Export & upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # signingStyle automatic + the API key: export creates/uses the
          # App Store distribution profile and signs the (unsigned) archive,
          # then 'destination: upload' hands it straight to TestFlight.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LensLink.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates
        working-directory: ios-app

      # Fills the TestFlight "What to Test" box from the latest GitHub
      # release's "What's Changed" notes, then assigns the build to the
      # beta groups named in the ASC_BETA_GROUPS repository variable
      # (comma-separated group names; unset = no assignment). Non-fatal:
      # the build is already uploaded; worst case the box stays empty
      # and testers are pointed at the build by hand.
      - name: Set "What to Test" and distribute to test groups
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          BUNDLE_ID: com.exaltedpixels.LensLinkCamera
          # Group assignment splits by channel: ASC_BETA_GROUPS is for
          # STABLE releases only (the name predates pre-releases and stays
          # for compatibility); pre-releases use ASC_PRERELEASE_GROUPS,
          # normally unset — a beta then reaches only the internal group,
          # with no variable-juggling between beta and release pushes.
          STABLE_GROUPS: ${{ vars.ASC_BETA_GROUPS }}
          PRERELEASE_GROUPS: ${{ vars.ASC_PRERELEASE_GROUPS }}
          IS_PRERELEASE: >-
            ${{ contains(inputs.tag || github.event.release.tag_name, '-beta.')
                || github.event.release.prerelease == true }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty for a release-triggered or manual run, where the script
          # falls back to /releases/latest as before.
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # Selected in shell, not a ${{ && || }} chain: an unset
          # pre-release variable would make the "ternary" fall through to
          # the stable groups — exactly the assignment a beta must not do.
          if [ "$IS_PRERELEASE" = "true" ]; then
            ASSIGN_GROUPS="$PRERELEASE_GROUPS"
            echo "pre-release: assigning to [${ASSIGN_GROUPS:-internal only}]"
          else
            ASSIGN_GROUPS="$STABLE_GROUPS"
          fi
          # Reuses the venv the build-number step set up.
          ASC_BETA_GROUPS="$ASSIGN_GROUPS" \
            BUILD_NUMBER="${{ steps.buildnum.outputs.build_number }}" \
            "$RUNNER_TEMP/asc-venv/bin/python" \
            .github/scripts/testflight_whats_to_test.py

      - name: Clean up API key
        if: always()
        run: rm -f ~/private_keys/AuthKey_*.p8
