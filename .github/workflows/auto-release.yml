name: Auto Release

# Every push to main that touches plugin or app code automatically gets a
# version tag and a published release with installable builds.
#
# The bump is a deliberate **git trailer** — a line, in any commit of the
# merged PR, that is EXACTLY one of these (case-insensitive):
#   Release-Bump: minor   -> minor (v0.3.0 -> v0.4.0)
#   Release-Bump: major   -> major (v0.3.0 -> v1.0.0)
#   (none)                -> patch (v0.3.0 -> v0.3.1)
#   Release-Skip: true    -> no release
#   Release-Beta: true    -> pre-release (v0.3.0 -> v0.3.1-beta.1)
# A trailer must be its own line, so merely *writing about* the keywords in
# prose can never trigger a bump (that mistake shipped v1.0.0 once).
#
# Release-Beta publishes the same builds, from the same code, and still
# uploads to TestFlight — TestFlight is the beta channel either way. What
# changes is the GitHub release: it's flagged "Pre-release", so it never
# becomes Latest and the README's version badge keeps pointing at the last
# stable build. The tag gains a -beta.N suffix, counting up within the
# version it is a beta *of*, so v0.3.1-beta.1, -beta.2, … all lead up to
# the eventual stable v0.3.1 (merge without the trailer to cut it).
on:
  push:
    branches: ["main"]
    paths:
      - "obs-plugin/**"
      - "ios-app/**"
      - "installer/**"
      - "streamdeck/**"

permissions:
  contents: read

# Two merges in quick succession must version sequentially: without this,
# both runs read the same latest tag, compute the same next version, and
# the loser's release is silently lost when its tag push fails.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  version:
    name: Tag next version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      ios: ${{ steps.bump.outputs.ios }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute and push tag
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # Refresh tags at the last moment: a queued run's checkout can
          # predate the previous run's tag push.
          git fetch origin --tags --quiet

          # Everything merged since the newest release tag, not just this
          # push: concurrency keeps one pending run, so a merge that queued
          # behind a running release would otherwise lose its trailers and
          # app changes. Release-Skip from commits before this push is
          # dropped, so an earlier skipped merge cannot suppress this one.
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$AFTER" 2>/dev/null \
                 || git rev-list --max-parents=0 "$AFTER" | tail -1)
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$base
          fi
          messages=$({ git log --reverse --format=%B "$base..$BEFORE" \
                         | grep -viE '^Release-Skip:[[:space:]]*true[[:space:]]*$' || true
                       git log --reverse --format=%B "$BEFORE..$AFTER"; })
          changed=$(git diff --name-only "$base" "$AFTER")

          # Did the app change? Gates the TestFlight job below: plugin- or
          # installer-only merges still release, but must not upload a
          # byte-identical app build to TestFlight.
          if grep -q '^ios-app/' <<< "$changed"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

          result=$(.github/scripts/next-version.sh \
                     <(git tag --list 'v*') <(printf '%s\n' "$messages"))
          tag=$(sed -n 's/^tag=//p' <<< "$result")
          echo "prerelease=$(sed -n 's/^prerelease=//p' <<< "$result")" >> "$GITHUB_OUTPUT"

          if [ -z "$tag" ]; then
            echo "Release-Skip is the last release directive — no release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing $tag"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Build & publish
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.version.outputs.tag }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
    permissions:
      contents: write

  # Called directly rather than relying on the `release: published`
  # trigger: releases created with GITHUB_TOKEN never trigger other
  # workflows (GitHub's recursion guard), so the TestFlight upload would
  # silently not happen for auto-releases.
  # Only when the push touched ios-app/: the version stream is repo-wide,
  # but a plugin- or installer-only release would otherwise upload an app
  # whose code hasn't changed (only the injected version/build number
  # would differ) — burning a macOS runner, an App Store Connect build
  # number, and a tester update notification for nothing.
  # Betas upload here too — TestFlight *is* the beta channel, so a
  # pre-release that skipped it would defeat the point. The tag is passed
  # explicitly because the "What to Test" lookup otherwise falls back to
  # /releases/latest, which by definition never returns a pre-release and
  # would quietly hand testers the previous stable release's notes.
  testflight:
    name: TestFlight
    needs: [version, release]
    if: needs.version.outputs.tag != '' && needs.version.outputs.ios == 'true'
    uses: ./.github/workflows/testflight.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  untag-failed:
    name: Remove tag of failed release
    needs: [version, release]
    if: failure() && needs.version.outputs.tag != '' && needs.release.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Delete the tag if no release was published
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::$TAG already has a release; keeping the tag."
            exit 0
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          echo "::warning::Release of $TAG failed before publishing; deleted the tag so the next merge reuses it."
