name: Build

# CI validation runs on PRs only. A push to main is already validated (the
# PR built the identical code), and the release workflow rebuilds + ships
# the artifacts — so building again on the main push would be pure waste.
#
# PRs build only what they touch: a cheap `changes` job diffs the PR and
# the build jobs are if-gated per area — plugin-only PRs skip the iOS
# build, app-only PRs skip the three plugin builds, docs-only PRs skip
# everything. The plugin and the app share no build inputs (only the wire
# protocol spec in docs/), so the split is safe. (A `paths:` filter would
# be simpler but breaks required checks — the workflow never runs, so the
# checks sit "expected" forever and the PR can't merge. Skipped jobs count
# as passing.)
on:
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the previous run: cancel the stale one
# instead of letting its builds (three on macOS runners) finish
# for a commit nobody can merge anymore. Auto-merge waits on the checks of
# the new head commit, so cancelling the old run costs nothing. Manual
# dispatches get a unique group (run_id) and are never cancelled.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.diff.outputs.plugin }}
      ios: ${{ steps.diff.outputs.ios }}
      site: ${{ steps.diff.outputs.site }}
      l10n: ${{ steps.diff.outputs.l10n }}
      workflows: ${{ steps.diff.outputs.workflows }}
      icon: ${{ steps.diff.outputs.icon }}
    steps:
      - uses: actions/checkout@v7

      - name: Diff against base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$BASE" ]; then
            # workflow_dispatch: build everything
            echo "plugin=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "l10n=true" >> "$GITHUB_OUTPUT"
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            echo "icon=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          # A workflow edit rebuilds everything: it may change any job.
          # The composite actions in .github/actions/ feed the plugin and
          # iOS builds, so each set includes its own.
          if echo "$CHANGED" | \
             grep -qE '^(obs-plugin/|installer/|\.github/workflows/build\.yml|\.github/actions/(libobs|plugin-|static-ffmpeg))'; then
            echo "plugin=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugin=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | \
             grep -qE '^(ios-app/|\.github/workflows/build\.yml|\.github/actions/(xcode-project|unsigned-ipa))'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | \
             grep -qE '^(site/|assets/|\.github/workflows/build\.yml)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | \
             grep -qE '^(ios-app/|obs-plugin/|site/|tools/(check-l10n|l10n_)|\.github/workflows/build\.yml)'; then
            echo "l10n=true" >> "$GITHUB_OUTPUT"
          else
            echo "l10n=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^\.github/(workflows/|actions/|actionlint\.yaml)'; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | \
             grep -qE '^(ios-app/Sources/AppIcon\.icon/|ios-app/Sources/Assets\.xcassets/AppIcon|assets/make-icon\.py|\.github/workflows/build\.yml)'; then
            echo "icon=true" >> "$GITHUB_OUTPUT"
          else
            echo "icon=false" >> "$GITHUB_OUTPUT"
          fi

  # GitHub validates expressions EVERYWHERE in a workflow file — comments
  # inside run: blocks included — and an invalid one fails the whole file
  # at run time with zero jobs and no PR-visible error. A stray
  # expression-delimiter pair in a shell comment got exactly that far once
  # and silently blocked a release, so workflow edits now lint before they
  # can merge. actionlint also shellchecks the run: blocks.
  workflows-lint:
    name: Workflow files lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) \
            1.7.12
          # -shellcheck= disables the shellcheck pass on run: blocks. It
          # only reported style notes on scripts that have shipped many
          # releases, plus one intentional unquoted expansion (the
          # optional VERSION_OVERRIDE argument, which must word-split).
          # The failure class this job exists for — invalid expressions,
          # which kill the whole file at validation with no PR-visible
          # error — is actionlint's own check and stays fully on.
          ./actionlint -color -shellcheck= .github/workflows/*.yml
  # The marketing/documentation site (site/) is a stdlib-only static
  # generator, so this job is seconds: build it and fail the PR on a
  # broken internal link or anchor before Cloudflare Pages publishes it.
  site:
    name: Website
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: python3 build.py
        working-directory: site

      - name: Check internal links
        run: python3 check-links.py
        working-directory: site

  l10n:
    name: Localization
    needs: changes
    if: needs.changes.outputs.l10n == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check localized strings
        run: python3 tools/check-l10n.py

  obs-plugin-linux:
    name: OBS plugin (Linux)
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/plugin-linux

      - name: Build with distro FFmpeg (-Wall -Wextra -Werror)
        run: |
          sudo apt-get install -y libavcodec-dev libavutil-dev
          cmake -B build-distro -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-distro
        working-directory: obs-plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: lenslink-linux-x86_64
          path: lenslink-linux-x86_64.tar.gz
          retention-days: 7

  obs-plugin-windows:
    name: OBS plugin (Windows)
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/plugin-windows

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: lenslink-windows-x64
          path: |
            lenslink-windows-x64.zip
            LensLink-installer-windows-x64.exe
          retention-days: 7

  obs-plugin-macos:
    name: OBS plugin (macOS)
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/plugin-macos
        with:
          strict: "true"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: lenslink-macos-universal
          path: |
            lenslink-macos-universal.zip
            LensLink-installer-macos-universal.pkg
          retention-days: 7

  ios-app:
    name: iOS app (LensLink)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Needs Xcode 16+: current XcodeGen emits project format 77, which
    # Xcode 15 (macos-14 runners) cannot open.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/unsigned-ipa

  ios-app-xcode27:
    name: iOS app (Xcode 27)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/unsigned-ipa
        with:
          xcode: "27"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: LensLink-unsigned-ipa-xcode27
          path: ios-app/LensLink-unsigned.ipa
          retention-days: 7

      - name: Render app icon previews
        if: ${{ !cancelled() && needs.changes.outputs.icon == 'true' }}
        run: |
          ICTOOL="$(dirname "$(xcode-select -p)")/Applications/Icon Composer.app/Contents/Executables/ictool"
          "$ICTOOL" --version
          mkdir -p icon-previews
          for r in Default Dark ClearLight ClearDark TintedLight TintedDark; do
            "$ICTOOL" Sources/AppIcon.icon --export-image \
              --output-file "icon-previews/AppIcon-$r.png" \
              --platform iOS --rendition "$r" --width 512 --height 512 --scale 2
          done
          if [ -f Payload/LensLink.app/Assets.car ]; then
            xcrun assetutil --info Payload/LensLink.app/Assets.car \
              | grep -E '"(Name|RenditionName|AssetType)"' | grep -i -B1 -A1 icon | head -60
          fi
        working-directory: ios-app

      - name: Upload app icon previews
        if: ${{ !cancelled() && needs.changes.outputs.icon == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-icon-previews
          path: ios-app/icon-previews
          retention-days: 7
