name: Release

# Push a version tag to publish a release with ready-to-install builds:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  # tag_name is required here too: without it a branch dispatch would run
  # all three builds and then skip publish (the gate below needs a tag).
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to publish the release under"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: "Existing tag to publish the release under"
        required: true
        type: string
      prerelease:
        description: >-
          Publish as a pre-release: flagged "Pre-release" on the releases
          page and never shown as Latest, so the README badge and anyone
          following the latest release stay on the last stable build.
          Assets, install table and TestFlight upload are unchanged.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plugin-linux:
    name: OBS plugin (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/plugin-linux
        with:
          version: ${{ inputs.tag_name || github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: lenslink-linux-x86_64.tar.gz

  plugin-windows:
    name: OBS plugin (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/plugin-windows
        with:
          version: ${{ inputs.tag_name || github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            lenslink-windows-x64.zip
            LensLink-installer-windows-x64.exe

  plugin-macos:
    name: OBS plugin (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/plugin-macos
        with:
          version: ${{ inputs.tag_name || github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            lenslink-macos-universal.zip
            LensLink-installer-macos-universal.pkg

  ios-app:
    name: iOS app (unsigned IPA)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/unsigned-ipa
        with:
          xcode: "27"
          version: ${{ inputs.tag_name || github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-ipa
          path: ios-app/LensLink-unsigned.ipa

  publish:
    name: Publish release
    needs: [plugin-linux, plugin-windows, plugin-macos, ios-app]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
    permissions:
      contents: write
    env:
      # Direct-download base for the install table's asset links.
      DL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Full history and every tag: the component table below asks, for
      # each half of the product, which release last changed it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: src

      # One repo ships two things, and a release cut for an app change
      # still carries plugin assets. Without this, every release reads
      # as "download the plugin again". The table says, per component,
      # whether this release changed it — and if not, which release did,
      # so nobody reinstalls a build they already have.
      - name: Which components changed
        id: components
        working-directory: src
        run: |
          tag="${{ inputs.tag_name || github.ref_name }}"
          repo_url="https://github.com/${{ github.repository }}"
          # Newest first, by creation: CI cuts tags in order, and version
          # sort would put a beta above the stable it precedes.
          mapfile -t tags < <(git tag --list 'v*' --sort=-creatordate)
          start=-1
          for i in "${!tags[@]}"; do
            if [ "${tags[$i]}" = "$tag" ]; then start=$i; break; fi
          done
          # The release in which a component last changed: walk back from
          # this tag until a tag-to-tag diff touches its paths.
          changed_since() {
            local paths=$1
            local i
            for ((i = start; i < ${#tags[@]} - 1; i++)); do
              if ! git diff --quiet "${tags[$((i + 1))]}" "${tags[$i]}" -- $paths; then
                echo "${tags[$i]}"
                return
              fi
            done
            echo "${tags[$((${#tags[@]} - 1))]}"
          }
          row() {
            local name=$1 since=$2 updated=$3 unchanged=$4
            if [ "$since" = "$tag" ]; then
              echo "| **$name** | $updated |"
            else
              echo "| **$name** | Unchanged since [$since]($repo_url/releases/tag/$since) — $unchanged |"
            fi
          }
          {
            echo "summary<<SUMMARY"
            if [ "$start" -ge 0 ]; then
              plugin_since=$(changed_since "obs-plugin installer")
              app_since=$(changed_since "ios-app")
              echo "## What's in this release"
              echo
              echo "| Component | This release |"
              echo "|-----------|--------------|"
              row "OBS plugin" "$plugin_since" "Updated — install it below." "nothing to reinstall."
              row "iPhone / iPad app" "$app_since" "Updated. TestFlight has it now; the App Store gets it once Apple approves the update." "the app you have is current."
              echo
            fi
            echo "SUMMARY"
          } >> "$GITHUB_OUTPUT"

      # The release-notes template. The install table must stay ABOVE the
      # generated notes (the API prepends `body`), and the "What's Changed"
      # heading GitHub generates is load-bearing: testflight_whats_to_test.py
      # takes everything after it for the TestFlight "What to Test" box.
      # The changelog itself is shaped by .github/release.yml.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          # The tag name is authoritative as well as the input: a -beta.N
          # tag pushed by hand must not publish as a stable release just
          # because it arrived without the flag set.
          prerelease: >-
            ${{ inputs.prerelease
                || contains(inputs.tag_name || github.ref_name, '-beta.') }}
          files: |
            dist/LensLink-installer-windows-x64.exe
            dist/lenslink-windows-x64.zip
            dist/LensLink-installer-macos-universal.pkg
            dist/lenslink-macos-universal.zip
            dist/lenslink-linux-x86_64.tar.gz
            dist/LensLink-unsigned.ipa
          body: |
            ${{ steps.components.outputs.summary }}
            ## Install

            | Platform | Download | Then |
            |----------|----------|------|
            | **Windows** | [Installer](${{ env.DL }}/LensLink-installer-windows-x64.exe) | Run it (finds your OBS folder automatically), restart OBS. |
            | **macOS** | [Installer](${{ env.DL }}/LensLink-installer-macos-universal.pkg) | Right-click → **Open** (not notarized), restart OBS. |
            | **Linux** | [Plugin tarball](${{ env.DL }}/lenslink-linux-x86_64.tar.gz) | Extract into `~/.config/obs-studio/plugins/`. |
            | **iPhone / iPad** | [App Store](https://apps.apple.com/app/lenslink-camera/id6790673163) | Free, updates automatically. Want builds before App Review? [TestFlight beta](https://testflight.apple.com/join/N7Rth6m3). |

            Plugin builds match OBS Studio 32.x; the macOS build is universal (macOS 13+).

            <details>
            <summary><b>Manual installs, sideloading, USB</b></summary>

            - **Windows zip:** extract [`lenslink-windows-x64.zip`](${{ env.DL }}/lenslink-windows-x64.zip) into `C:\Program Files\obs-studio\`, merging folders.
            - **macOS zip:** extract [`lenslink-macos-universal.zip`](${{ env.DL }}/lenslink-macos-universal.zip) into `~/Library/Application Support/obs-studio/plugins/`, then clear quarantine: `xattr -dr com.apple.quarantine ~/Library/Application\ Support/obs-studio/plugins/lenslink.plugin`
            - **iOS sideload:** install [`LensLink-unsigned.ipa`](${{ env.DL }}/LensLink-unsigned.ipa) with [Sideloadly](https://sideloadly.io) — free Apple IDs re-sign every 7 days.
            - **USB on Windows** needs iTunes (it provides Apple's device driver).

            Full setup guide: the [README](https://github.com/${{ github.repository }}#install).
            </details>
