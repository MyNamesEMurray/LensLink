name: Release

# Push a version tag to publish a release with ready-to-install builds:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  # tag_name is required here too: without it a branch dispatch would run
  # all three builds and then skip publish (the gate below needs a tag).
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to publish the release under"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: "Existing tag to publish the release under"
        required: true
        type: string
      prerelease:
        description: >-
          Publish as a pre-release: flagged "Pre-release" on the releases
          page and never shown as Latest, so the README badge and anyone
          following the latest release stay on the last stable build.
          Assets, install table and TestFlight upload are unchanged.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  plugin-linux:
    name: OBS plugin (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libobs-dev qt6-base-dev

      # The release tarball has to run on every distro, but linking a
      # shared FFmpeg pins an FFmpeg-major soname (libavcodec.so.60)
      # that rolling distros no longer ship — the plugin then fails to
      # load at all (issue #65; the same failure hit Windows as #91/#93
      # when an OBS update moved its bundled FFmpeg). So all release
      # builds link the minimal static FFmpeg this action builds.
      - name: Build static FFmpeg (H.264/HEVC decode only)
        uses: ./.github/actions/static-ffmpeg

      # The grep guard: the status-bar/dock UI degrades *silently* when Qt6
      # or obs-frontend-api.h is missing (that's how releases shipped
      # without it once) — a release build must fail instead.
      #
      # --exclude-libs,ALL hides the static FFmpeg's symbols in the module:
      # the link fails without it (FFmpeg's asm uses PC-relative refs that
      # need non-preemptible symbols), and the OBS process carries its own
      # shared FFmpeg whose symbols must never interpose ours.
      - name: Build
        run: |
          set -o pipefail
          version="${{ inputs.tag_name || github.ref_name }}"
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ffmpeg-static/lib/pkgconfig" \
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DLENSLINK_VERSION="${version#v}" \
            -DCMAKE_MODULE_LINKER_FLAGS="-Wl,--exclude-libs,ALL" \
            | tee configure.log
          grep -q "frontend UI enabled" configure.log
          cmake --build build
        working-directory: obs-plugin

      # Fail the release if the binary regressed to soname-coupled shared
      # FFmpeg (the exact breakage of issue #65), or lost its VAAPI link.
      # Plain `if grep`, not `! grep`: a `!` line that isn't the last
      # command is non-fatal under the runner's bash -e, so the old
      # negated form could never fail the step.
      - name: Verify FFmpeg linked statically
        run: |
          readelf -d obs-plugin/build/lenslink.so | tee needed.log
          if grep -E "NEEDED.*(libavcodec|libavutil)" needed.log; then
            echo "::error::lenslink.so links shared FFmpeg (issue #65)"
            exit 1
          fi
          grep -qE "NEEDED.*libva\.so" needed.log

      - name: Package (extract into ~/.config/obs-studio/plugins)
        run: |
          mkdir -p stage/lenslink/bin/64bit stage/lenslink/data
          cp obs-plugin/build/lenslink.so stage/lenslink/bin/64bit/
          cp -r obs-plugin/data/* stage/lenslink/data/
          tar czf lenslink-linux-x86_64.tar.gz -C stage lenslink

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: lenslink-linux-x86_64.tar.gz

  plugin-windows:
    name: OBS plugin (Windows)
    runs-on: windows-2022
    env:
      # libobs + Qt6 pins only — FFmpeg is linked statically (see the
      # static-ffmpeg action step), so these no longer have to track the
      # FFmpeg inside the OBS release users run (issues #91, #93).
      OBS_REF: "32.1.2"
      DEPS_TAG: "2025-08-23"
    steps:
      - uses: actions/checkout@v7

      # No submodules here: cache-hit runs only need in-tree headers
      # (libobs/, deps/w32-pthreads/); the recursive fetch runs only on a
      # cache miss, inside the build step.
      - name: Checkout obs-studio (for libobs)
        uses: actions/checkout@v7
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_REF }}
          path: obs-studio

      - name: Download OBS prebuilt dependencies (for libobs; Qt6)
        run: |
          curl -L -o deps.zip "https://github.com/obsproject/obs-deps/releases/download/${{ env.DEPS_TAG }}/windows-deps-${{ env.DEPS_TAG }}-x64.zip"
          7z x deps.zip -oobs-deps
          # Qt6 (same bundle OBS itself builds with): needed only for the
          # plugin's status-bar/dock UI — keep in sync with build.yml.
          curl -L -o deps-qt6.zip "https://github.com/obsproject/obs-deps/releases/download/${{ env.DEPS_TAG }}/windows-deps-qt6-${{ env.DEPS_TAG }}-x64.zip"
          7z x -y deps-qt6.zip -oobs-deps

      - name: Build static FFmpeg (H.264/HEVC decode only)
        uses: ./.github/actions/static-ffmpeg

      - name: Cache libobs build
        id: cache-libobs
        uses: actions/cache@v6
        with:
          path: obs-build
          key: libobs-${{ env.OBS_REF }}-${{ env.DEPS_TAG }}

      - name: Build libobs
        if: steps.cache-libobs.outputs.cache-hit != 'true'
        run: |
          git -C obs-studio submodule update --init --recursive
          cmake -S obs-studio -B obs-build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}\obs-deps" `
            -DENABLE_UI=OFF -DENABLE_FRONTEND=OFF -DENABLE_PLUGINS=OFF `
            -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF -DENABLE_WEBSOCKET=OFF `
            -DENABLE_AJA=OFF
          cmake --build obs-build --target libobs --config Release

      # The Select-String guard: the status-bar/dock UI degrades *silently*
      # when Qt6 or obs-frontend-api.h is missing (that's how releases
      # shipped without it once) — a release build must fail instead.
      # DISABLE_FIND_PACKAGE_PkgConfig + the static FFmpeg paths: keep in
      # sync with build.yml (see the note there).
      - name: Build plugin
        run: |
          $version = "${{ inputs.tag_name || github.ref_name }}".TrimStart("v")
          cmake -S obs-plugin -B plugin-build -G "Visual Studio 17 2022" -A x64 `
            -DLENSLINK_VERSION="$version" `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}\obs-deps" `
            -DLIBOBS_INCLUDE_DIR="${{ github.workspace }}\obs-studio\libobs;${{ github.workspace }}\obs-build\config;${{ github.workspace }}\obs-studio\deps\w32-pthreads" `
            -DLIBOBS_LIBRARY="${{ github.workspace }}\obs-build\libobs\Release\obs.lib;${{ github.workspace }}\obs-build\deps\w32-pthreads\Release\w32-pthreads.lib" `
            -DOBS_FRONTEND_API_HINT="${{ github.workspace }}\obs-studio\frontend\api;${{ github.workspace }}\obs-studio\UI\obs-frontend-api" `
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON `
            -DFFMPEG_INCLUDE_DIR="${{ github.workspace }}\ffmpeg-static\include" `
            -DAVCODEC_LIBRARY="${{ github.workspace }}\ffmpeg-static\lib\avcodec.lib" `
            -DAVUTIL_LIBRARY="${{ github.workspace }}\ffmpeg-static\lib\avutil.lib" `
            | Tee-Object -FilePath configure.log
          if (-not (Select-String -Quiet -SimpleMatch "frontend UI enabled" -Path configure.log)) {
            throw "status-bar/dock UI missing from this release build (Qt6/obs-frontend-api not found)"
          }
          cmake --build plugin-build --config Release

      # A release DLL importing avcodec-NN.dll/avutil-NN.dll only loads
      # while OBS ships that exact FFmpeg major — the next OBS update
      # breaks it with LoadLibrary error 126 (issues #91, #93). The
      # obs.dll check keeps the negative check honest.
      - name: Verify FFmpeg linked statically
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * `
            -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          $deps = & $dumpbin /dependents plugin-build\Release\lenslink.dll | Out-String
          Write-Host $deps
          if ($deps -match "avcodec|avutil") {
            throw "lenslink.dll imports OBS's FFmpeg DLLs (breaks on OBS updates)"
          }
          if ($deps -notmatch "obs\.dll") {
            throw "obs.dll import missing - dependents dump looks wrong"
          }

      - name: Package (extract into C:\Program Files\obs-studio)
        run: |
          New-Item -ItemType Directory -Force -Path stage\obs-plugins\64bit | Out-Null
          New-Item -ItemType Directory -Force -Path stage\data\obs-plugins\lenslink | Out-Null
          Copy-Item plugin-build\Release\lenslink.dll stage\obs-plugins\64bit\
          Copy-Item -Recurse obs-plugin\data\* stage\data\obs-plugins\lenslink\
          Compress-Archive -Path stage\* -DestinationPath lenslink-windows-x64.zip

      # One-click alternative to the zip: detects the OBS folder from the
      # registry and registers an uninstaller. Inno Setup is preinstalled
      # on the runner image; the guard covers image changes.
      - name: Build installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $version = "${{ inputs.tag_name || github.ref_name }}".TrimStart("v")
          iscc /DAppVersion=$version installer\windows\lenslink.iss

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            lenslink-windows-x64.zip
            LensLink-installer-windows-x64.exe

  plugin-macos:
    name: OBS plugin (macOS)
    runs-on: macos-15
    env:
      # libobs + Qt6 pins only — FFmpeg is linked statically (see the
      # static-ffmpeg action step), so these no longer have to track the
      # FFmpeg inside the OBS release users run (issues #91, #93).
      OBS_REF: "32.1.2"
      DEPS_TAG: "2025-08-23"
    steps:
      - uses: actions/checkout@v7

      # No submodules here: cache-hit runs only need in-tree headers
      # (libobs/); the recursive fetch runs only on a cache miss, inside
      # the build step.
      - name: Checkout obs-studio (for libobs)
        uses: actions/checkout@v7
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_REF }}
          path: obs-studio

      - name: Download OBS prebuilt dependencies (for libobs; Qt6)
        run: |
          curl -L -o deps.tar.xz "https://github.com/obsproject/obs-deps/releases/download/${{ env.DEPS_TAG }}/macos-deps-${{ env.DEPS_TAG }}-universal.tar.xz"
          mkdir obs-deps
          tar -xJf deps.tar.xz -C obs-deps
          # Qt6 for the status-bar/dock UI — keep in sync with build.yml.
          curl -L -o deps-qt6.tar.xz "https://github.com/obsproject/obs-deps/releases/download/${{ env.DEPS_TAG }}/macos-deps-qt6-${{ env.DEPS_TAG }}-universal.tar.xz"
          tar -xJf deps-qt6.tar.xz -C obs-deps

      - name: Build static FFmpeg (H.264/HEVC decode only)
        uses: ./.github/actions/static-ffmpeg

      # "macos" in the key: cache keys are not runner-scoped, and the
      # Windows job already uses libobs-<ref>-<tag> for its MSVC build.
      - name: Cache libobs build
        id: cache-libobs
        uses: actions/cache@v6
        with:
          path: obs-build
          key: libobs-macos-${{ env.OBS_REF }}-${{ env.DEPS_TAG }}

      # Xcode generator: obs-studio's macOS CMake requires it. Universal
      # (arm64 + x86_64) to match the deps bundle and the official OBS app.
      - name: Build libobs
        if: steps.cache-libobs.outputs.cache-hit != 'true'
        run: |
          git -C obs-studio submodule update --init --recursive
          # libobs-metal is a pure-Swift target added unconditionally on
          # macOS; without obs-studio's own presets the Swift language is
          # never enabled and CMake's generate step fails. We only need
          # libobs, so drop it from the build.
          sed -i '' 's|add_subdirectory(libobs-metal)||' obs-studio/CMakeLists.txt
          cmake -S obs-studio -B obs-build -G Xcode \
            -DCMAKE_PREFIX_PATH="$PWD/obs-deps" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="-" \
            -DENABLE_UI=OFF -DENABLE_FRONTEND=OFF -DENABLE_PLUGINS=OFF \
            -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF
          cmake --build obs-build --target libobs --config Release

      # The grep guard: the status-bar/dock UI degrades *silently* when Qt6
      # or obs-frontend-api.h is missing (that's how releases shipped
      # without it once) — a release build must fail instead.
      # DISABLE_FIND_PACKAGE_PkgConfig + the static FFmpeg paths: keep in
      # sync with build.yml (see the note there).
      - name: Build plugin
        run: |
          set -o pipefail
          version="${{ inputs.tag_name || github.ref_name }}"
          cmake -S obs-plugin -B plugin-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLENSLINK_VERSION="${version#v}" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_PREFIX_PATH="$PWD/obs-deps" \
            -DOBS_FRONTEND_API_HINT="$PWD/obs-studio/frontend/api;$PWD/obs-studio/UI/obs-frontend-api" \
            -DLIBOBS_INCLUDE_DIR="$PWD/obs-studio/libobs;$PWD/obs-build/config" \
            -DLIBOBS_LIBRARY="$PWD/obs-build/libobs/Release/libobs.framework" \
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON \
            -DFFMPEG_INCLUDE_DIR="$PWD/ffmpeg-static/include" \
            -DAVCODEC_LIBRARY="$PWD/ffmpeg-static/lib/libavcodec.a" \
            -DAVUTIL_LIBRARY="$PWD/ffmpeg-static/lib/libavutil.a" \
            | tee configure.log
          grep -q "frontend UI enabled" configure.log
          cmake --build plugin-build

      # A release binary referencing libavcodec.NN.dylib only loads while
      # OBS ships that exact FFmpeg major — the next OBS update breaks it
      # (the macOS twin of Windows issues #91, #93). The libobs check
      # keeps the negative check honest. Plain `if grep`, not `! grep`:
      # a `!` line that isn't last is non-fatal under bash -e.
      - name: Verify FFmpeg linked statically
        run: |
          otool -L plugin-build/lenslink.so | tee deps.log
          if grep -E "libav(codec|util)" deps.log; then
            echo "::error::lenslink.so links OBS's shared FFmpeg dylibs"
            exit 1
          fi
          grep -q "libobs" deps.log

      # Ad-hoc signature only: without an Apple Developer ID the bundle
      # can't be notarized, so users clear the quarantine flag once (the
      # release notes explain how).
      - name: Package (extract into ~/Library/Application Support/obs-studio/plugins)
        run: |
          version="${{ inputs.tag_name || github.ref_name }}"
          version="${version#v}"
          mkdir -p stage/lenslink.plugin/Contents/MacOS \
                   stage/lenslink.plugin/Contents/Resources
          cp plugin-build/lenslink.so stage/lenslink.plugin/Contents/MacOS/lenslink
          sed "s/@VERSION@/$version/" installer/macos/Info.plist \
            > stage/lenslink.plugin/Contents/Info.plist
          plutil -lint stage/lenslink.plugin/Contents/Info.plist
          cp -R obs-plugin/data/ stage/lenslink.plugin/Contents/Resources/
          codesign --force --sign - --deep stage/lenslink.plugin
          ditto -c -k --keepParent stage/lenslink.plugin lenslink-macos-universal.zip

      # One-click alternative to the zip: pkgbuild makes the component,
      # productbuild wraps it in a distribution that installs to the
      # *user's* OBS plugin folder (see installer/macos/distribution.xml
      # for why that path is mandatory on Apple Silicon).
      - name: Build installer
        run: |
          version="${{ inputs.tag_name || github.ref_name }}"
          version="${version#v}"
          mkdir -p pkgroot
          cp -R stage/lenslink.plugin pkgroot/
          pkgbuild --root pkgroot \
            --identifier com.lenslink.obs-plugin \
            --version "$version" \
            --install-location "/Library/Application Support/obs-studio/plugins" \
            --component-plist installer/macos/component.plist \
            lenslink-component.pkg
          sed "s/@VERSION@/$version/" installer/macos/distribution.xml > distribution.xml
          productbuild --distribution distribution.xml --package-path . \
            LensLink-installer-macos-universal.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            lenslink-macos-universal.zip
            LensLink-installer-macos-universal.pkg

  ios-app:
    name: iOS app (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios-app

      - name: Build unsigned device IPA
        run: |
          set -o pipefail
          # Same version-from-tag rule as testflight.yml, so the sideload
          # IPA reports the release it came from instead of a static 1.0.
          version="${{ inputs.tag_name || github.ref_name }}"
          version="${version#v}"
          version="${version%%-*}"
          xcodebuild build \
            -project LensLink.xcodeproj \
            -scheme LensLink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$version"
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/LensLink.app Payload/
          zip -ry LensLink-unsigned.ipa Payload
        working-directory: ios-app

      - uses: actions/upload-artifact@v7
        with:
          name: release-ipa
          path: ios-app/LensLink-unsigned.ipa

  publish:
    name: Publish release
    needs: [plugin-linux, plugin-windows, plugin-macos, ios-app]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
    env:
      # Direct-download base for the install table's asset links.
      DL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The release-notes template. The install table must stay ABOVE the
      # generated notes (the API prepends `body`), and the "What's Changed"
      # heading GitHub generates is load-bearing: testflight_whats_to_test.py
      # takes everything after it for the TestFlight "What to Test" box.
      # The changelog itself is shaped by .github/release.yml.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          # The tag name is authoritative as well as the input: a -beta.N
          # tag pushed by hand must not publish as a stable release just
          # because it arrived without the flag set.
          prerelease: >-
            ${{ inputs.prerelease
                || contains(inputs.tag_name || github.ref_name, '-beta.') }}
          files: |
            dist/LensLink-installer-windows-x64.exe
            dist/lenslink-windows-x64.zip
            dist/LensLink-installer-macos-universal.pkg
            dist/lenslink-macos-universal.zip
            dist/lenslink-linux-x86_64.tar.gz
            dist/LensLink-unsigned.ipa
          body: |
            ## Install

            | Platform | Download | Then |
            |----------|----------|------|
            | **Windows** | [Installer](${{ env.DL }}/LensLink-installer-windows-x64.exe) | Run it (finds your OBS folder automatically), restart OBS. |
            | **macOS** | [Installer](${{ env.DL }}/LensLink-installer-macos-universal.pkg) | Right-click → **Open** (not notarized), restart OBS. |
            | **Linux** | [Plugin tarball](${{ env.DL }}/lenslink-linux-x86_64.tar.gz) | Extract into `~/.config/obs-studio/plugins/`. |
            | **iPhone / iPad** | [TestFlight beta](https://testflight.apple.com/join/N7Rth6m3) | Installs via TestFlight, updates automatically. |

            Plugin builds match OBS Studio 32.x; the macOS build is universal (macOS 13+).

            <details>
            <summary><b>Manual installs, sideloading, USB</b></summary>

            - **Windows zip:** extract [`lenslink-windows-x64.zip`](${{ env.DL }}/lenslink-windows-x64.zip) into `C:\Program Files\obs-studio\`, merging folders.
            - **macOS zip:** extract [`lenslink-macos-universal.zip`](${{ env.DL }}/lenslink-macos-universal.zip) into `~/Library/Application Support/obs-studio/plugins/`, then clear quarantine: `xattr -dr com.apple.quarantine ~/Library/Application\ Support/obs-studio/plugins/lenslink.plugin`
            - **iOS sideload:** install [`LensLink-unsigned.ipa`](${{ env.DL }}/LensLink-unsigned.ipa) with [Sideloadly](https://sideloadly.io) — free Apple IDs re-sign every 7 days.
            - **USB on Windows** needs iTunes (it provides Apple's device driver).

            Full setup guide: the [README](https://github.com/${{ github.repository }}#install).
            </details>
