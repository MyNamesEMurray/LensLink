name: Unsigned iOS IPA
description: >-
  Builds the app for the device and packages it as
  ios-app/LensLink-unsigned.ipa. It can't be installed as-is: sideload
  it with a tool that re-signs with your Apple ID (Sideloadly /
  AltStore).

inputs:
  xcode:
    description: Xcode major version to select; empty keeps the image default.
    required: false
    default: ""
  version:
    description: >-
      Release tag or version (v1.8.2, 1.8.2-beta.3, ...) for
      MARKETING_VERSION. Empty keeps the project.yml default.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/xcode-project
      with:
        xcode: ${{ inputs.xcode }}

    # Unsigned device build packaged as an .ipa: proves every Swift
    # source compiles for the real platform, so a separate Simulator
    # build would just double the macOS minutes.
    - name: Build unsigned device IPA
      shell: bash
      working-directory: ios-app
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -o pipefail
        # Same version-from-tag rule as testflight.yml, so the sideload
        # IPA reports the release it came from instead of a static 1.0.
        version="${VERSION#v}"
        version="${version%%-*}"
        extra=()
        if [ -n "$version" ]; then
          extra+=("MARKETING_VERSION=$version")
        fi
        xcodebuild build \
          -project LensLink.xcodeproj \
          -scheme LensLink \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          "${extra[@]}"
        mkdir -p Payload
        cp -R DerivedData/Build/Products/Release-iphoneos/LensLink.app Payload/
        zip -ry LensLink-unsigned.ipa Payload
