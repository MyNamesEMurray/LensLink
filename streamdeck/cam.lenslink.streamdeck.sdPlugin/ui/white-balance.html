<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<script src="sdpi-components.js"></script>
	<script src="locales.js"></script>
</head>
<body>
	<sdpi-item label="__MSG_Source__">
		<sdpi-select setting="source" datasource="sources" hot-reload default=""></sdpi-select>
	</sdpi-item>
	<sdpi-item label="__MSG_Key sets__">
		<sdpi-select setting="mode" default="temperature">
			<option value="temperature">__MSG_Temperature__</option>
			<option value="auto">__MSG_Auto__</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="__MSG_Kelvin__">
		<sdpi-textfield setting="kelvin" default="5600"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="__MSG_OBS port__">
		<sdpi-textfield setting="port" global placeholder="9980"></sdpi-textfield>
	</sdpi-item>
</body>
</html>
